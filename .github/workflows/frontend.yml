name: Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: App env from .env.example
        run: for app in apps/*/; do cp "$app.env.example" "$app.env"; done
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build build-storybook

  e2e:
    name: E2E (Playwright, mock data)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: App env from .env.example
        run: for app in apps/*/; do cp "$app.env.example" "$app.env"; done
      - run: pnpm --filter @frontend/client exec playwright install --with-deps chromium
      - run: pnpm build
      # Full evidence (screenshot + video + trace of every test) so each run can be audited.
      - run: pnpm test:e2e:evidence
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            frontend/apps/*/playwright-report
            frontend/apps/*/test-results/junit.xml
          retention-days: 14
